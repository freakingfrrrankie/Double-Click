<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Unresolved inputs</title>
    <!-- SEO 

    <!-- STYLING -->
    <link rel="stylesheet" href="/styling/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
            <div class="top-nav">
            <div class="left"><a href="#">contents</a></div>
            <div class="middle"><a href="index.html">ᓚᘏᕐᐷ</a></div>
            <div class="right"><a href="#">contributors</a></div>
            </div>
    </header>
    <div class="main-layout">
    
        <!-- LEFT — side nav -->
        <aside class="content-bar" id="content-bar">
            <button class="panel-close" aria-label="Close">&#8604;</button>
            <iframe name="side-nav" class="side-nav" src="/pages/nav.html" title="Side Nav"></iframe>
        </aside>

        <!-- CENTER — default loads gallery -->
        <main>  
            <iframe name="main-content" class="main-content" src="pages/gallery.html" title="Main Content"></iframe>
        </main>

        <!-- RIGHT — footnote -->
        <aside class="footnote-panel" id="footnote-panel">
            <button class="panel-close" aria-label="Close">&#8605;</button>
            <iframe name="footnote" class="footnote" src="pages/footnote.html" title="Footnote"></iframe>
        </aside>

    </div>
<script>
document.querySelectorAll('.nav-toggle').forEach(link => {
    link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = document.getElementById(link.dataset.target);
        const isAlreadyActive = target.classList.contains('is-active');

        document.querySelectorAll('aside.is-active').forEach(a => a.classList.remove('is-active'));

        if (!isAlreadyActive) {
            target.classList.add('is-active');
        }
    });
});

document.querySelectorAll('.panel-close').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.closest('aside').classList.remove('is-active');
    });
});

// NEW: auto-open the footnote panel on mobile when its iframe navigates
const footnoteIframe = document.querySelector('.footnote');
const footnotePanel = document.getElementById('footnote-panel');
let isInitialLoad = true;

footnoteIframe.addEventListener('load', () => {
    if (isInitialLoad) {
        isInitialLoad = false; // skip the very first load (the default src on page load)
        return;
    }
    if (window.matchMedia('(max-width: 600px)').matches) {
        document.querySelectorAll('aside.is-active').forEach(a => a.classList.remove('is-active'));
        footnotePanel.classList.add('is-active');
    }
});
</script>
</html>
